<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>续播起播耗时 · Via 真机</title>
<style>
  body { font: 13px/1.55 system-ui, sans-serif; margin: 10px 12px 90px; color: #222; background: #f5f5f7; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  p { font-size: 11px; color: #777; margin: 0 0 10px; }
  #hud { position: fixed; left: 0; right: 0; top: 0; z-index: 2147483647; pointer-events: none;
      background: rgba(0,0,0,.82); color: #9fe870; font: 10px/1.45 ui-monospace, monospace;
      padding: 5px 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<div id="hud">等待脚本注入…</div>
<h1>续播起播耗时（Via 真机）</h1>
<p>先播到 7s 关掉（写下续播位置），再打开同一个视频，量「打开 → 首帧」以及 metadata / seeking / seeked
   的时间点。同一份已缓存的文件重复 3 轮取中位数，用来判断「续播 seek 提前」有没有真的省下那 0.5 秒。</p>

<script>
(function () {
    'use strict';
    var hud = document.getElementById('hud');
    var RUN = (/resume-android-([A-Za-z0-9._-]+)\.html/.exec(location.pathname) || [])[1] || '';
    var ROUNDS = Number((/\?(?:.*&)?rounds=(\d+)/.exec(location.search) || [])[1] || 3);
    var ONLY = ((/\?(?:.*&)?only=([^&]+)/.exec(location.search) || [])[1] || '')
        .split(',').map(function (s) { return s.trim(); }).filter(Boolean);

    function send(o) {
        o.run = RUN; o.t = Date.now();
        try { fetch('/__report', { method: 'POST', body: JSON.stringify(o) }); } catch (e) {}
    }
    function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
    function hudText(s) { hud.textContent = s; }

    // 两个场景都用本地素材：mp4 是 720p 渐进式（支持 Range），HLS 是两段 10s 分片。
    // seed 是「播到几秒再关」——必须留在续播的可用区间里：
    // vvResumeTarget 要求 t>5，且剩余时长要大于尾巴（<60s 的片子按 max(3s, 10%) 算）。
    // 本地 mp4 只有 10s，所以只能停在 6.5s；HLS 有 20s，停 8s 更宽裕。
    var SCEN = [
        { id: 'mp4', label: '直连 mp4（已缓存二次打开）', type: 'MP4', url: '/e2e/media/bb720.mp4', seed: 6.5 },
        { id: 'hls', label: 'HLS（分片已缓存二次打开）', type: 'HLS', url: '/.tmp/hls-gen/resume.m3u8', seed: 8 }
    ];
    // 同一个场景的 URL 必须跨轮稳定：续播记录是按 URL 存的，每轮换 query 就等于每轮都是新片子
    var TAG = (/\?(?:.*&)?tag=([A-Za-z0-9._-]+)/.exec(location.search) || [])[1] || 'stable';

    var vvRef = null;
    function player() {
        var root = document.querySelector('.vv-player-root');
        return { root: root, v: root && root.querySelector('video') };
    }
    async function untilReady() {
        for (var i = 0; i < 100; i++) {
            if (window.__vv && window.__vv.open) return window.__vv;
            await wait(200);
        }
        return null;
    }
    function open(sc) {
        vvRef.open({ url: location.origin + sc.url + '?tag=' + TAG, type: sc.type,
            name: '续播耗时 · ' + sc.id, source: 'test' });
    }
    function closeAll() {
        try { vvRef.close(); } catch (e) {}
    }

    // 打开并把各时间点记下来：metadata / seeking / seeked / playing 一次不落
    async function openAndTrace(sc, budgetMs) {
        var p0 = player();
        var evs = [];
        var t0 = performance.now();
        open(sc);
        var lastV = null;
        while (performance.now() - t0 < budgetMs) {
            var p = player();
            var v = p.v;
            if (v && v !== lastV) {
                lastV = v;
                ['loadedmetadata', 'loadeddata', 'seeking', 'seeked', 'playing', 'canplay']
                    .forEach(function (n) {
                        v.addEventListener(n, function () {
                            evs.push({ n: n, at: Math.round(performance.now() - t0),
                                ct: +v.currentTime.toFixed(2), rx: v.readyState });
                        });
                    });
            }
            if (v && !v.paused && v.readyState >= 2 && evs.some(function (e) { return e.n === 'playing'; })) break;
            await wait(50);
        }
        // 再留一点时间让 seeked 之类落定
        await wait(400);
        var v2 = player().v;
        var dg = {};
        try { dg = vvRef.startDiag() || {}; } catch (eD) {}
        var first = {};
        ['loadedmetadata', 'loadeddata', 'seeking', 'seeked', 'playing', 'canplay'].forEach(function (n) {
            var hit = evs.filter(function (e) { return e.n === n; })[0];
            first[n] = hit ? hit.at : -1;
        });
        return {
            evs: evs,
            first: first,
            ctAtMeta: (evs.filter(function (e) { return e.n === 'loadedmetadata'; })[0] || {}).ct,
            ctAtPlaying: (evs.filter(function (e) { return e.n === 'playing'; })[0] || {}).ct,
            ctEnd: v2 ? +v2.currentTime.toFixed(2) : -1,
            seeks: evs.filter(function (e) { return e.n === 'seeking'; }).length,
            // 早落位有没有真的生效：early = 算出的目标位，srcFrag = 直连是否用了 #t=
            early: dg.early || 0,
            srcFrag: dg.srcFrag || 0
        };
    }

    // 第一步：播到目标秒数再关，写下续播位置（不然后面几轮量的是冷起播）
    async function seed(sc) {
        var t0 = performance.now();
        open(sc);
        var v = null, at = -1;
        while (performance.now() - t0 < 25000) {
            v = player().v;
            if (v && v.readyState >= 2 && v.currentTime >= sc.seed) break;
            await wait(60);
        }
        // 关得太晚就落到「快看完了」的尾巴区，续播会被主动放弃，量出来是冷起播
        if (v) { at = +v.currentTime.toFixed(2); }
        closeAll();
        await wait(1200);
        return at;
    }

    async function main() {
        var vv = await untilReady();
        vvRef = vv;
        var expect = (/\?(?:.*&)?expect=([\d.]+)/.exec(location.search) || [])[1] || '';
        send({ tag: 'env', version: vv && vv.VV ? vv.VV.version : 'none', expect: expect,
            ua: navigator.userAgent.slice(0, 120), vw: innerWidth, vh: innerHeight, dpr: devicePixelRatio });
        if (!vv) { send({ tag: 'done', scenes: 0, err: 'no __vv' }); return; }

        var list = ONLY.length ? SCEN.filter(function (s) { return ONLY.indexOf(s.id) >= 0; }) : SCEN;
        for (var i = 0; i < list.length; i++) {
            var sc = list[i];
            hudText('▶ ' + sc.id + ' · 预置续播位置');
            var seeded = await seed(sc);
            send({ tag: 'seed', id: sc.id, at: seeded });
            for (var r = 1; r <= ROUNDS; r++) {
                hudText('▶ ' + sc.id + ' · 第 ' + r + '/' + ROUNDS + ' 轮');
                var res = await openAndTrace(sc, 15000);
                res.tag = 'round'; res.id = sc.id; res.round = r;
                send(res);
                hudText(sc.id + ' 第' + r + '轮 · metadata ' + res.first.loadedmetadata +
                    'ms · 首帧 ' + res.first.playing + 'ms · seek ' + res.seeks + ' 次');
                // 关之前把位置摆回预置点：量一轮会让 currentTime 往后走 0.5s 左右，
                // 几轮下来就漂到「快看完了」的尾巴区，续播会被主动放弃（第 3 轮量成冷起播）
                var pv = player().v;
                if (pv) {
                    try { pv.pause(); pv.currentTime = sc.seed; } catch (eS) {}
                }
                await wait(500);
                closeAll();
                await wait(1200);
            }
        }
        send({ tag: 'done', scenes: list.length });
    }
    main().catch(function (e) {
        send({ tag: 'fatal', msg: String(e && (e.stack || e.message || e)) });
        send({ tag: 'done', scenes: 0, err: 'fatal' });
    });
})();
</script>
<!-- 不在这里加载 dist：真机测试台依赖 Via 已安装的用户脚本注入 -->
</body>
</html>
