<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>pool-stress</title>
<style>
  body { margin:0; background:#0b0b0b; color:#e8e8e8; font:11px/1.5 ui-monospace,Menlo,monospace; padding:8px; }
  #head { font:700 18px/1.3 sans-serif; color:#fff; margin-bottom:6px; }
  #log { white-space:pre-wrap; word-break:break-all; max-height:34vh; overflow:auto; background:#161616; padding:8px; border-radius:6px; }
  #grid { display:grid; grid-template-columns:repeat(5,1fr); gap:4px; margin-top:8px; }
  .cell { position:relative; background:#000; border-radius:3px; overflow:hidden; aspect-ratio:16/9; }
  video { width:100%; height:100%; object-fit:cover; display:block; }
  .lbl { position:absolute; left:2px; top:1px; font:9px/1 monospace; color:#0f0; text-shadow:0 0 3px #000; }
  .bad { color:#f66; }
</style>
</head>
<body>
<div id="head">10 路并发播放压测</div>
<div id="log"></div>
<div id="grid"></div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var N = Number(q.get('n') || 10);            // 并发路数
  var STEP = Number(q.get('step') || 1200);    // 每路间隔
  var HOLD = Number(q.get('hold') || 9000);    // 全起后保持时长
  var MODE = q.get('mode') || 'mp4';
  var SRC = MODE === 'hls'
      ? 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8'
      : (location.origin + '/e2e/flower.mp4');
  var logEl = document.getElementById('log');
  var grid = document.getElementById('grid');
  var els = [];

  function log(s) {
    var d = new Date();
    var div = document.createElement('div');
    div.textContent = '[' + d.toTimeString().slice(0, 8) + '.' + String(d.getMilliseconds()).padStart(3, '0') + '] ' + s;
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
    document.title = s;
  }
  var wait = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };

  function state() {
    var ready = 0, playing = 0, errs = 0, dims = {};
    els.forEach(function (v) {
      if (v.readyState >= 2) ready++;
      if (!v.paused && v.readyState >= 2) playing++;
      if (v.error) errs++;
      var k = v.videoWidth + 'x' + v.videoHeight;
      dims[k] = (dims[k] || 0) + 1;
    });
    return { n: els.length, ready: ready, playing: playing, err: errs, dims: dims };
  }

  (async function () {
    log('boot n=' + N + ' mode=' + MODE + ' src=' + SRC.slice(-28));
    await wait(800);

    for (var i = 1; i <= N; i++) {
      var v = document.createElement('video');
      v.muted = true;
      v.playsInline = true;
      v.setAttribute('playsinline', '');
      v.setAttribute('webkit-playsinline', '');
      v.preload = 'auto';
      v.src = SRC;
      var cell = document.createElement('div');
      cell.className = 'cell';
      var lbl = document.createElement('div');
      lbl.className = 'lbl';
      lbl.textContent = '#' + i;
      cell.appendChild(v); cell.appendChild(lbl);
      grid.appendChild(cell);
      els.push(v);

      var res = 'sync';
      var p = v.play();
      if (p && p.then) {
        res = await p.then(function () { return 'ok'; }).catch(function (e) { return 'REJ:' + e.name; });
      }
      log('#' + i + ' play()=' + res + ' rs=' + v.readyState + ' ' + (v.videoWidth || 0) + 'x' + (v.videoHeight || 0));
      await wait(STEP);
    }

    log('全部发起，等 ' + (HOLD / 1000) + 's 稳定');
    await wait(HOLD);
    var s = state();
    log('HOLD 结束时 ready=' + s.ready + '/' + s.n + ' playing=' + s.playing + ' err=' + s.err + ' dims=' + JSON.stringify(s.dims));
    var detail = els.map(function (v, k) {
      return ('#' + (k + 1)) + ' rs=' + v.readyState + ' ' + (v.videoWidth || 0) + 'x' + (v.videoHeight || 0) +
             (v.error ? ' ERR' + v.error.code : '') + (v.paused ? ' P' : ' RUN');
    });
    log(detail.join(' | '));

    // 全部释放：pause → 摘 src → load()
    log('开始释放 10 路');
    els.forEach(function (v) {
      try { v.pause(); } catch (e) {}
      try { v.removeAttribute('src'); } catch (e) {}
      try { v.load(); } catch (e) {}
    });
    await wait(4000);
    var s2 = state();
    log('释放+4s ready=' + s2.ready + ' playing=' + s2.playing + ' err=' + s2.err);
    els.forEach(function (v, k) {
      try { v.parentNode && v.parentNode.parentNode && v.parentNode.parentNode.removeChild(v.parentNode); } catch (e) {}
    });
    log('DONE 元素已从 DOM 移除');
  })();
})();
</script>
</body>
</html>
