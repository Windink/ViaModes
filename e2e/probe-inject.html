<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>probe-inject</title>
<style>body{margin:0;background:#0d0d0d;color:#e8e8e8;font:13px/1.6 ui-monospace,monospace;padding:12px;word-break:break-all}#o{white-space:pre-wrap}</style>
</head>
<body>
<div id="o">probing…</div>
<iframe id="f" src="probe-inner.html?vvdebug=1" style="width:100%;height:120px;border:1px solid #333;margin-top:10px"></iframe>
<script>
var early = (typeof window.__vv === 'object') ? 'YES' : 'NO';
// 这个页面不引用任何外部脚本。如果 __vv 仍然存在，就说明 Via 自己把安装过的
// 用户脚本注入了页面 —— 之前所有真机测试可能跑的都是旧版，必须查清。
setTimeout(function () {
  var lines = [];
  var dbg = window.__vv;
  lines.push('__vv 存在: ' + (dbg ? 'YES' : 'NO'));
  if (dbg) {
    var k = Object.keys(dbg);
    lines.push('接口数: ' + k.length);
    lines.push('有 lastTeardown: ' + (typeof dbg.lastTeardown === 'function' ? 'YES' : 'NO'));
    lines.push('有 tornDown: ' + (typeof dbg.tornDown === 'function' ? 'YES' : 'NO'));
    lines.push('有 hlsPool: ' + (typeof dbg.hlsPool === 'function' ? 'YES' : 'NO'));
  }
  var ss = document.querySelectorAll('script[src]');
  lines.push('外部脚本数: ' + ss.length);
  for (var i = 0; i < ss.length; i++) lines.push('  ' + ss[i].src);
  // Via 注入的脚本通常不在 DOM 里，但会在 document 上留下样式节点
  lines.push('vv 样式节点: ' + document.querySelectorAll('style[id^="vv"],style[data-vv]').length);
  lines.push('body 里 vv 元素: ' + document.querySelectorAll('[class^="vv-"],[id^="vv-"]').length);
  lines.push('inline 脚本执行瞬间 __vv: ' + early + '（YES 说明注入是 document-start）');
  // iframe 里若没有 __vv，就能在隔离上下文里跑我们自己的构建，不受 Via 注入干扰
  try {
    var w = document.getElementById('f').contentWindow;
    lines.push('iframe 里 __vv: ' + (w.__vv ? 'YES(' + Object.keys(w.__vv).length + ' 个接口)' : 'NO'));
    lines.push('iframe 有 lastTeardown: ' + (w.__vv && typeof w.__vv.lastTeardown === 'function' ? 'YES' : 'NO'));
  } catch (e) { lines.push('iframe 读取失败: ' + e.message); }
  document.getElementById('o').textContent = lines.join('\n');
}, 2500);
</script>
</body>
</html>
