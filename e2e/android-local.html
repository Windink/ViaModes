<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>android-codec-test</title>
<style>
  body { margin: 0; background: #111; color: #eee; font: 16px/1.5 -apple-system, "PingFang SC", sans-serif; padding: 14px; }
  h1 { font-size: 17px; margin: 0 0 10px; font-weight: 600; }
  #log { white-space: pre-wrap; word-break: break-all; font: 12px/1.65 ui-monospace, Menlo, monospace; background: #1b1b1b; padding: 12px; border-radius: 8px; min-height: 55vh; }
  video { width: 100%; max-height: 120px; background: #000; margin-top: 12px; border-radius: 6px; }
</style>
</head>
<body>
<h1>真机 codec 释放测试</h1>
<div id="log"></div>
<video id="v1" muted playsinline preload="metadata" src="flower.mp4"></video>
<script src="via-video-player.user.js"></script>
<script>
(function () {
    var ROUNDS = 3;
    var logEl = document.getElementById('log');
    var lines = [];

    function log(s) {
        var d = new Date();
        var t = d.toTimeString().slice(0, 8) + '.' + String(d.getMilliseconds()).padStart(3, '0');
        lines.push('[' + t + '] ' + s);
        logEl.textContent = lines.join('\n');
        document.title = s;
    }
    function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
    function mediaUrl() { try { return new URL('flower.mp4', location.href).href; } catch (e) { return 'flower.mp4'; } }
    function snap() {
        var v = document.querySelector('.vv-player-video');
        return {
            pool: window.__vv ? window.__vv.hlsPool() : -1,
            srcLen: window.__vv ? window.__vv.videoSrcLen() : -1,
            root: !!document.getElementById('vv-player-root'),
            paused: v ? v.paused : null,
            rs: v ? v.readyState : null
        };
    }

    (async function () {
        log('boot q=' + location.search + ' hash=' + location.hash);
        log('file=' + location.href.slice(0, 80));
        await wait(1200);
        if (!window.__vv) {
            log('FATAL: __vv 不存在（地址要带 ?vvdebug=1 或 #vvdebug=1）');
            return;
        }
        log('句柄就绪, media=' + mediaUrl());
        log('UA=' + navigator.userAgent.slice(0, 60));

        for (var i = 1; i <= ROUNDS; i++) {
            log('R' + i + ' open');
            try { window.__vv.open({ url: mediaUrl(), type: 'MP4', name: 'android-test' }); }
            catch (e) { log('R' + i + ' open 异常: ' + e.message); }

            await wait(6000);
            log('R' + i + ' 播放中 ' + JSON.stringify(snap()));

            log('R' + i + ' close');
            try { window.__vv.close(); } catch (e) { log('R' + i + ' close 异常: ' + e.message); }

            await wait(1200);
            log('R' + i + ' +1.2s ' + JSON.stringify(snap()));
            await wait(2000);
            log('R' + i + ' +3.2s ' + JSON.stringify(snap()));
            await wait(1800);
        }
        log('DONE');
    })();
})();
</script>
</body>
</html>
